name: Fetch media assets

on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/vtm-leistungen-konfigurator-arw4vr

      - name: Download generated assets
        run: |
          mkdir -p assets
          curl -fL --retry 3 -o assets/hero-loop.mp4 "https://d8j0ntlcm91z4.cloudfront.net/user_3GK5fibZJUNs4KnXvEQ87FA3v46/hf_20260721_194403_3aee469a-e842-49fa-ba0c-348501bdf066.mp4"
          curl -fL --retry 3 -o assets/hero-master.webp "https://d8j0ntlcm91z4.cloudfront.net/user_3GK5fibZJUNs4KnXvEQ87FA3v46/hf_20260721_194120_fdf14a25-efd8-46ce-8627-99975ff50504_min.webp"
          curl -fL --retry 3 -o assets/podcast-mic.webp "https://d8j0ntlcm91z4.cloudfront.net/user_3GK5fibZJUNs4KnXvEQ87FA3v46/hf_20260721_192906_3bef134c-6d43-48a9-abc0-eb93b3b14d4b_min.webp"
          curl -fL --retry 3 -o assets/network-band.webp "https://d8j0ntlcm91z4.cloudfront.net/user_3GK5fibZJUNs4KnXvEQ87FA3v46/hf_20260721_192908_bc06911d-317d-4267-81fb-d7286276d76e_min.webp"
          ls -la assets/

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add generated media assets (hero loop + stills)"
          git push
